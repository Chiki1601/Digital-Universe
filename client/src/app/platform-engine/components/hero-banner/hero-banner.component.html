<section class="hero-banner" aria-label="Platform hero">
  <div class="hero-banner__glow" aria-hidden="true"></div>
  @if (tagline()) {
    <p class="hero-banner__tagline">{{ tagline() }}</p>
  }
  <h1 class="hero-banner__title">{{ title() }}</h1>
  @if (description()) {
    <p class="hero-banner__description">{{ description() }}</p>
  }
</section>
