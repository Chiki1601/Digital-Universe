<div class="filter-panel" role="group" aria-label="Filter">
  <button
    type="button"
    class="filter-panel__pill"
    [class.is-active]="selected() === null"
    (click)="selectionChange.emit(null)"
  >
    {{ label() }}
  </button>
  @for (option of options(); track option) {
    <button
      type="button"
      class="filter-panel__pill"
      [class.is-active]="selected() === option"
      (click)="selectionChange.emit(option)"
    >
      {{ option }}
    </button>
  }
</div>
